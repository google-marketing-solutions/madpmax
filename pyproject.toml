# Developer tool settings for Mad PMax. Nothing in this file is deployed: the
# Cloud Function is built from the functions/ folder only.

[tool.pytest.ini_options]
testpaths = ["functions/test", ".github/scripts"]
pythonpath = ["functions", ".github/scripts"]
python_files = ["test_*.py", "*_test.py"]
# Unit tests must never reach the network (pytest-socket).
addopts = [
  "--disable-socket",
  "--allow-unix-socket",
  # TODO(#11): Repair these stale tests and remove the entries below.
  # They fail on main for reasons that predate CI: some mocks no longer match
  # the code, and a few tests call the real OAuth endpoint.
  "--deselect=functions/test/test_asset_group_creation.py::TestAssetGroupService::test_create_asset_group_return_error_on_too_long_path1",
  "--deselect=functions/test/test_asset_group_creation.py::TestAssetGroupService::test_create_asset_group_return_error_on_too_long_path2",
  "--deselect=functions/test/utils_test.py::TestUtils::test_process_api_response_and_errors_no_errors",
  "--deselect=functions/test/utils_test.py::TestUtils::test_process_api_response_and_errors_with_errors",
  "--deselect=functions/test/utils_test.py::TestUtils::test_process_operations_errors",
]

[tool.pyink]
# Google Python style: 2-space indent, 80 characters.
line-length = 80
pyink-indentation = 2
pyink-use-majority-quotes = true
target-version = ["py312"]

[tool.pylint.main]
py-version = "3.12"

[tool.pylint.basic]
# As in Google's pylintrc: tests and dunder methods don't need docstrings.
no-docstring-rgx = "(__.*__|main|test.*|.*test|.*Test)$"

[tool.pylint.format]
indent-string = "  "
max-line-length = 80

[tool.pylint.typecheck]
# googleapiclient builds these members at run time, so pylint can't see them.
generated-members = ["files", "spreadsheets"]
